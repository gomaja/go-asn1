title = "go-asn1 gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Generated ASN.1 field assignments can match the generic API key heuristic."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^telecom/lte/s1ap/s1apies\.go$''',
  '''^telecom/lte/x2ap/(x2appducontents|x2apies)\.go$''',
]
regexes = [
  '''^\s+v\.[A-Za-z0-9]+ = ''',
]

[[allowlists]]
description = "Generated alias of the TS 25.331 type E-RUCCH-AccessServiceClass, which matches the generic API key heuristic."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^telecom/umts/rrc/informationelements\.go$''',
]
regexes = [
  '''^\s*type ERUCCHAccessServiceClass = PRACHPartitioningLCRR4\s*$''',
]

[[allowlists]]
description = "Generated S1AP choice tolerance bookkeeping can match the generic API key heuristic across two lines."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^telecom/lte/s1ap/s1apies\.go$''']
regexes = ['''^\s*case UES1APIDsChoiceUES1APIDPair:\r?\n\s*toleranceMark_ues1apidpair := bb\.EnterComponent\("UES1APIDPair"\)\s*$''']

[[allowlists]]
description = "The same S1AP choice tolerance bookkeeping in the concrete shards, where the case label is shard-qualified."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^telecom/lte/s1ap/internal/s[0-9]{2}/generated\.go$''']
regexes = ['''^s[0-9]{2}\.UES1APIDsChoiceUES1APIDPair:\r?\n\s*toleranceMark_ues1apidpair\s*$''']

[[allowlists]]
description = "Generated facade aliases of shard declarations, such as const IdMeNBUEX2APID = s00.IdMeNBUEX2APID, can match the generic API key heuristic."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^telecom/lte/(lppa|s1ap|x2ap)/(api|facade)\.go$''']
regexes = ['''^[A-Za-z0-9]+ = s[0-9]{2}\.[A-Za-z0-9]+$''']

[[allowlists]]
description = "Generated API ledger entries are quoted Go identifiers and selectors; two adjacent entries can match the generic API key heuristic."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^telecom/lte/(lppa|s1ap|x2ap)/api-ledger\.json$''']
regexes = ['''^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*",\s+"[A-Za-z0-9]+(\.[A-Za-z0-9]+)*"$''']
